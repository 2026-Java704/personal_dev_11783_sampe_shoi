<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>新規タスク作成</title>
	<style>
		body {
			font-family: "Comic Sans MS", Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
			background-color: #f1f5f9;
			color: #1e293b;
			margin: 0;
			padding: 40px 20px;
		}

		h1 {
			max-width: 600px;
			margin: 0 auto 24px auto;
			color: #0f172a;
			font-size: 26px;
		}

		form {
			max-width: 600px;
			margin: 0 auto;
			background: #fff;
			padding: 35px;
			border-radius: 16px;
			box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
		}

		table {
			width: 100%;
			border-collapse: collapse;
			border: none !important;
		}

		th,
		td {
			padding: 16px 0;
			border-bottom: 1px solid #f1f5f9;
			text-align: left;
		}

		th {
			width: 30%;
			color: #475569;
			font-size: 18px;
			font-weight: 700;
			vertical-align: top;
			padding-top: 14px;
		}

		input[type="text"],
		input[type="date"],
		input[type="number"],
		textarea {
			width: 100%;
			padding: 12px;
			border: 2px solid #e2e8f0;
			border-radius: 8px;
			font-size: 14px;
			box-sizing: border-box;
			transition: all 0.2s;
			background-color: #f8fafc;
		}

		input[type="text"]:focus,
		input[type="date"]:focus,
		input[type="number"]:focus,
		textarea:focus {
			border-color: #3b82f6;
			background-color: #fff;
			outline: none;
			box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
		}

		input[type="number"] {
			width: 110px;
			display: inline-block;
		}

		textarea {
			resize: vertical;
		}

		label {
			margin-right: 20px;
			font-size: 14px;
			font-weight: 600;
			color: #334155;
			cursor: pointer;
			display: inline-flex;
			align-items: center;
			gap: 6px;
			margin-bottom: 5px;
		}

		button[type="submit"] {
			background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
			color: white;
			border: none;
			padding: 14px 24px;
			border-radius: 10px;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
			width: 100%;
			margin-top: 24px;
			transition: all 0.2s;
			box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
		}

		button[type="submit"]:hover {
			transform: translateY(-1px);
			box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
		}
	</style>
</head>

<body>
	<h1>新規タスク作成</h1>
	<form th:action="@{/tasks/create}" method="post">
		<table border="1">
			<tr>
				<th>カテゴリ</th>
				<td>
					<label><input type="radio" name="categoryId" value="2" required style="transform:scale(1.5);">
						仕事</label>
					<label><input type="radio" name="categoryId" value="1" style="transform:scale(1.5);"> 日常</label>
				</td>
			</tr>
			<tr>
				<th>タイトル</th>
				<td><input type="text" name="title" required></td>
			</tr>
			<tr>
			    <th>優先度</th>
			    <td>
			        <label><input type="radio" name="priority" value="高" style="transform:scale(1.5);"> 高</label>
			        <label><input type="radio" name="priority" value="中" checked style="transform:scale(1.5);"> 中</label>
			        <label><input type="radio" name="priority" value="低" style="transform:scale(1.5);"> 低</label>
			    </td>
			</tr>
			<tr>
				<th>タスク開始日</th>
				<td><input type="date" name="date" required></td>
			</tr>
			<tr>
				<th>期限</th>
				<td><input type="date" name="closingDate" required></td>
			</tr>
			<tr>
				<th>予想所要時間</th>
				<td><input type="number" name="time" style="text-align: right;" required> 分</td>
			</tr>
			<tr>
				<th>メモ</th>
				<td><textarea name="memo" rows="4" cols="40"></textarea></td>
			</tr>
		</table>
		<br>
		<button type="submit">新規作成</button>
	</form>
</body>

</html>
