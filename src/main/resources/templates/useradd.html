<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>新規登録</title>
</head>

<body>
	<h1>新規登録画面</h1>
	<form th:action="@{/users/add}" method="post">
		<input type="text" name="name" placeholder="ユーザ名" required><br><br>
		<input type="password" name="password" placeholder="パスワード" required><br><br>
		<input type="password" name="password_confirm" placeholder="パスワード確認" required><br><br>
		<button type="submit">登録</button>
	</form>
</body>

</html>
