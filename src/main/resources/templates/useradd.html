<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規登録画面</title>
</head>
<body>

    <h1>新規登録画面</h1>

    <form th:action="@{/users/add}" method="post">
        <div>
            <input type="text" name="name" placeholder="ユーザ名" required>
        </div>
        <br>
        <div>
            <input type="password" name="password" placeholder="パスワード" required>
        </div>
        <br>
        <div>
            <input type="password" name="password_confirm" placeholder="パスワード確認" required>
        </div>
        <br>
        <button type="submit">登録</button>
    </form>

</body>
</html>
