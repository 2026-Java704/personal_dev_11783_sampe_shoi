<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>新規登録</title>
	<style>
		body {
			font-family: 'Helvetica Neue', Arial, sans-serif;
			background-color: #f4f6f9;
			color: #333;
			margin: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
		}

		h1 {
			color: #2c3e50;
			margin-bottom: 24px;
			font-size: 28px;
		}

		form {
			background: #ffffff;
			padding: 30px;
			border-radius: 8px;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
			width: 100%;
			max-width: 320px;
			box-sizing: border-box;
		}

		input[type="text"],
		input[type="password"] {
			width: 100%;
			padding: 12px;
			border: 1px solid #ccd1d9;
			border-radius: 6px;
			font-size: 14px;
			box-sizing: border-box;
			transition: border-color 0.2s;
		}

		input[type="text"]:focus,
		input[type="password"]:focus {
			border-color: #3498db;
			outline: none;
		}

		button[type="submit"] {
			width: 100%;
			background-color: #3498db;
			color: white;
			border: none;
			padding: 12px;
			border-radius: 6px;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
			transition: background-color 0.2s;
		}

		button[type="submit"]:hover {
			background-color: #2980b9;
		}
	</style>
</head>

<body>
	<h1>新規登録画面</h1>
	<form id="registerForm" th:action="@{/users/add}" method="post" onsubmit="return validatePassword()">
		<input type="text" name="name" placeholder="ユーザ名" required><br><br>
		<input type="password" id="password" name="password" placeholder="パスワード" required><br><br>
		<input type="password" id="password_confirm" name="password_confirm" placeholder="パスワード確認" required><br><br>
		<button type="submit">登録</button>
	</form>

	<script>
		function validatePassword() {
			var password = document.getElementById("password").value;
			var confirm = document.getElementById("password_confirm").value;

			if (password !== confirm) {
				alert("パスワードが一致していません。もう一度入力してください。");
				return false;
			}

			return true;
		}
	</script>

</body>

</html>
