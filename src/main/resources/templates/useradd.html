<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>新規登録</title>
	<style>
		body {
			font-family: "Comic Sans MS", Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
			background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%);
			color: #2c3e50;
			margin: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
		}

		h1 {
			color: #1e3a8a;
			margin-bottom: 24px;
			font-size: 28px;
			font-weight: 700;
			letter-spacing: -0.5px;
		}

		form {
			background: #ffffff;
			padding: 35px;
			border-radius: 16px;
			box-shadow: 0 10px 25px rgba(30, 58, 138, 0.08);
			width: 100%;
			max-width: 340px;
			box-sizing: border-box;
		}

		input[type="text"],
		input[type="password"] {
			width: 100%;
			padding: 14px;
			border: 2px solid #e2e8f0;
			border-radius: 10px;
			font-size: 14px;
			box-sizing: border-box;
			transition: all 0.2s ease;
			background-color: #f8fafc;
		}

		input[type="text"]:focus,
		input[type="password"]:focus {
			border-color: #3b82f6;
			background-color: #fff;
			box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
			outline: none;
		}

		button[type="submit"] {
			width: 100%;
			background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
			color: white;
			border: none;
			padding: 14px;
			border-radius: 10px;
			font-size: 16px;
			font-weight: bold;
			cursor: pointer;
			transition: all 0.2s ease;
			box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
		}

		button[type="submit"]:hover {
			transform: translateY(-1px);
			box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
		}

		button[type="submit"]:active {
			transform: translateY(0);
		}

		a {
			color: #2563eb;
			text-decoration: none;
			font-size: 14px;
			font-weight: 600;
			margin-top: 15px;
			transition: color 0.2s;
		}

		a:hover {
			color: #1d4ed8;
			text-decoration: underline;
		}

		div[th\:if] {
			padding: 14px;
			margin-bottom: 20px;
			border-radius: 10px;
			font-size: 14px;
			width: 100%;
			max-width: 340px;
			box-sizing: border-box;
			text-align: center;
			font-weight: 600;
		}

		div[text*="違い"],
		div[text*="存在します"] {
			background-color: #fef2f2;
			color: #ef4444;
			border: 1px solid #fee2e2;
		}

		div[text*="完了"] {
			background-color: #f0fdf4;
			color: #16a34a;
			border: 1px solid #dcfce7;
		}
	</style>
</head>

<body>
	<h1>新規登録画面</h1>
	<div th:if="${error}"
		style="background-color: #fde8e8; color: #e74c3c; border: 1px solid #f8b4b4; padding: 12px; margin-bottom: 20px; border-radius: 6px; font-size: 14px; width: 100%; max-width: 320px; box-sizing: border-box; text-align: center;"
		th:text="${error}"></div>
	<form id="registerForm" th:action="@{/users/add}" method="post" onsubmit="return validatePassword()">
		<input type="text" name="name" placeholder="ユーザ名（20文字以内）" maxlength="20" required><br><br>
		<input type="password" id="password" name="password" placeholder="パスワード（6〜20文字）" maxlength="20"
			required><br><br>
		<input type="password" id="password_confirm" name="password_confirm" placeholder="パスワード確認" maxlength="20"
			required><br><br>
		<button type="submit">登録</button>
	</form>

	<script>
		function validatePassword() {
			var password = document.getElementById("password").value;
			var confirm = document.getElementById("password_confirm").value;

			if (password.length < 6) {
				alert("パスワードは6文字以上で入力してください。");
				return false;
			}

			if (password !== confirm) {
				alert("パスワードが一致していません。もう一度入力してください。");
				return false;
			}

			return true;
		}
	</script>

</body>

</html>
