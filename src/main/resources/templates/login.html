<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>ログイン</title>
	<style>
			body {
				font-family: 'Helvetica Neue', Arial, sans-serif;
				background-color: #f4f6f9;
				color: #333;
				margin: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
			}

			h1 {
				color: #2c3e50;
				margin-bottom: 24px;
				font-size: 28px;
			}

			form {
				background: #ffffff;
				padding: 30px;
				border-radius: 8px;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
				width: 100%;
				max-width: 320px;
				box-sizing: border-box;
			}

			input[type="text"],
			input[type="password"] {
				width: 100%;
				padding: 12px;
				border: 1px solid #ccd1d9;
				border-radius: 6px;
				font-size: 14px;
				box-sizing: border-box;
				transition: border-color 0.2s;
			}

			input[type="text"]:focus,
			input[type="password"]:focus {
				border-color: #3498db;
				outline: none;
			}

			button[type="submit"] {
				width: 100%;
				background-color: #3498db;
				color: white;
				border: none;
				padding: 12px;
				border-radius: 6px;
				font-size: 16px;
				font-weight: bold;
				cursor: pointer;
				transition: background-color 0.2s;
			}

			button[type="submit"]:hover {
				background-color: #2980b9;
			}

			a {
				color: #3498db;
				text-decoration: none;
				font-size: 14px;
			}

			a:hover {
				text-decoration: underline;
			}

			div[th\:if] {
				padding: 12px;
				margin-bottom: 20px;
				border-radius: 6px;
				font-size: 14px;
				width: 100%;
				max-width: 320px;
				box-sizing: border-box;
				text-align: center;
			}
			div[text*="違い"] {
				background-color: #fde8e8;
				color: #e74c3c;
				border: 1px solid #f8b4b4;
			}
			div[text*="完了"] {
				background-color: #def7ec;
				color: #27ae60;
				border: 1px solid #bcf0da;
			}
		</style>
</head>

<body>
	<h1>Todoアプリ ログイン</h1>
	<div th:if="${success}" th:text="${success}"></div>
	<div th:if="${error}" th:text="${error}"></div>

	<form th:action="@{/login}" method="post">
		<input type="text" name="name" placeholder="ユーザ名" required><br><br>
		<input type="password" name="password" placeholder="パスワード" required><br><br>
		<button type="submit">ログイン</button>
	</form>
	<br>
	<a th:href="@{/users/new}">新規登録<br></a>
</body>

</html>
