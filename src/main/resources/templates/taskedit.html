<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head><meta charset="UTF-8"><title>内容変更</title></head>
<body>
    <h1>内容変更</h1>
    <form th:action="@{/tasks/{id}/edit(id=${task.id})}" method="post">
        <table border="1">
            <tr>
                <th>カテゴリ</th>
                <td>
                    <label><input type="radio" name="categoryId" value="1" th:checked="${task.categoryId == 1}"> 日常</label>
					<label><input type="radio" name="categoryId" value="2" th:checked="${task.categoryId == 2}"> 仕事</label>
				</td>
            </tr>
            <tr><th>タイトル</th><td><input type="text" name="title" th:value="${task.title}" required></td></tr>
            <tr>
                <th>進捗状況</th>
                <td>
                    <label><input type="radio" name="progress" value="未着手" th:checked="${task.progress == '未着手'}"> 未着手</label>
                    <label><input type="radio" name="progress" value="進行中" th:checked="${task.progress == '進行中'}"> 進行中</label>
                    <label><input type="radio" name="progress" value="完了" th:checked="${task.progress == '完了'}"> 完了</label>
                </td>
            </tr>
            <tr><th>タスク開始日</th><td><input type="date" name="date" th:value="${task.date}" required></td></tr>
            <tr><th>期限</th><td><input type="date" name="closingDate" th:value="${task.closingDate}" required></td></tr>
            <tr><th>予想所要時間</th><td><input type="number" name="time" th:value="${task.time}" required> 分</td></tr>
            <tr><th>メモ</th><td><textarea name="memo" rows="4" cols="40" th:text="${task.memo}"></textarea></td></tr>
        </table>
        <br>
        <button type="submit">変更</button>
    </form>
</body>
</html>
